name: Build HVP site

on:
  workflow_dispatch:
  push:
    branches: [feat/oppiainehakemisto]
    paths:
      - scripts/build_hvp_site.py
      - .github/workflows/build-hvp-site.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oppiainehakemisto
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf
      - name: Build subject pages
        run: python scripts/build_hvp_site.py
      - name: Validate generated site
        run: |
          test -f index.html
          test -f sitemap.xml
          test "$(find . -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -ge 20
          ! grep -RIlE 'C:\\Users|file://' --include='*.html' .
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate subject HVP pages"
            git push origin HEAD:feat/oppiainehakemisto
          fi
